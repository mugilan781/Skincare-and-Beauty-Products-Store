<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your VelourSkin account to track orders, manage your routine and shop faster.">
  <title>Sign In — VelourSkin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="apple-touch-icon" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/extended.css">
  <link rel="stylesheet" href="assets/css/icons.css">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="loginTitle">
    <a href="index.html" class="auth-brand" aria-label="VelourSkin home">Velour<span>Skin</span></a>

    <h1 id="loginTitle">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue to your account.</p>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="auth-status" data-form-status role="status" aria-live="polite"></div>

      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input class="form-control" type="email" id="loginEmail" name="email"
               placeholder="you@example.com" autocomplete="email" required aria-describedby="loginEmail-error">
        <p class="field-error" id="loginEmail-error" role="alert"></p>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Password</label>
        <div class="password-wrap">
          <input class="form-control" type="password" id="loginPassword" name="password"
                 placeholder="Enter your password" autocomplete="current-password" required aria-describedby="loginPassword-error">
          <button type="button" class="password-toggle" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false"></button>
        </div>
        <p class="field-error" id="loginPassword-error" role="alert"></p>
      </div>

      <div class="auth-row">
        <label class="remember-check" for="rememberMe">
          <input type="checkbox" id="rememberMe" name="remember"> Remember me
        </label>
        <a class="auth-link" href="contact.html">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
    </form>

    <div class="auth-divider" aria-hidden="true">or continue with</div>

    <div class="auth-social">
      <a class="auth-social-btn" href="https://www.google.com" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        Google
      </a>
      <a class="auth-social-btn" href="https://www.facebook.com" aria-label="Continue with Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.52 1.5-3.91 3.78-3.91 1.1 0 2.24.2 2.24.2v2.47h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.44 2.9h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
        Facebook
      </a>
      <a class="auth-social-btn" href="https://www.apple.com" aria-label="Continue with Apple">
        <svg viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
        Apple
      </a>
    </div>

    <p class="auth-redirect">Don&rsquo;t have an account? <a class="auth-link" href="signup.html">Sign Up</a></p>
  </main>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
