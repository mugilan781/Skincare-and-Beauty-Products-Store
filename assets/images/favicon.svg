<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C9A66B" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F23" />
      <stop offset="100%" stop-color="#181113" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />
  
  <!-- Subtle Botanical Leaf Silhouette at Top Right -->
  <path d="M 330 110 C 370 120 400 160 390 200 C 360 190 330 160 330 110 Z" fill="url(#goldGrad)" opacity="0.4" />
  <path d="M 345 135 C 385 140 405 170 395 200" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />

  <!-- Elegant Luxury 'V' Monogram with Floral Stem -->
  <g filter="url(#goldGlow)">
    <!-- Serif 'V' -->
    <path d="M 130 150 L 195 150 C 185 170 180 185 180 200 L 236 345 L 292 200 C 292 185 287 170 277 150 L 342 150 C 330 170 322 185 315 205 L 246 380 C 242 390 230 390 226 380 L 157 205 C 150 185 142 170 130 150 Z" fill="url(#goldGrad)" />
    
    <!-- Delicate Diamond Sparkle on Center Top -->
    <path d="M 236 108 L 242 124 L 258 130 L 242 136 L 236 152 L 230 136 L 214 130 L 230 124 Z" fill="url(#goldGrad)" />
  </g>
</svg>
